# GitHub Pages に自動で公開する設定
# main ブランチに変更が入るたびに、このリポジトリの内容がそのまま公開されます
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 手動でも実行できるようにする

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v4

      - name: 中身をチェックする
        run: node tools/build.mjs --check

      - name: Pages の準備
        uses: actions/configure-pages@v5

      - name: 公開するファイルをまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v4
